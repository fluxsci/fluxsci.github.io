project:
  type: website
  output-dir: ../dist
  render:
    - index.qmd
    - 404.qmd
    - install/index.qmd
    - docs/*.qmd
  resources:
    - assets/**
    - demos/**
    - install.sh
    - robots.txt

website:
  title: Flux
  description: A suite of software tools designed from the start for science. Figures, presentations, literature, and papers, all connected in one place, with built-in tools to connect the AI agent of your choice.
  site-url: https://fluxsci.github.io/
  image: assets/brand/social-card.png
  repo-url: https://github.com/fluxsci/fluxsci.github.io
  search: false
  open-graph:
    locale: en_US
  twitter-card:
    card-style: summary_large_image

format:
  html:
    minimal: true
    theme: none
    title-block-style: none
    toc: false
    number-sections: false
    anchor-sections: false
    smooth-scroll: false
    lang: en
    css:
      - assets/styles/site.css
      - assets/styles/docs.css
    include-in-header:
      text: |
        <meta name="color-scheme" content="light dark">
        <script>try{const theme=localStorage.getItem('flux-site-appearance');if(theme==='light'||theme==='dark')document.documentElement.setAttribute('data-theme',theme)}catch{}</script>
        <script>(function(){var h=document.documentElement;h.classList.add('js');try{if(location.pathname==='/'&&!sessionStorage.getItem('flux-intro')){sessionStorage.setItem('flux-intro','1');h.classList.add('intro')}}catch(e){h.classList.add('intro')}})()</script>
        <link rel="canonical" href="https://fluxsci.github.io/">
        <meta property="og:type" content="website">
        <meta property="og:url" content="https://fluxsci.github.io/">
        <link rel="icon" href="/assets/brand/flux-mark.svg" type="image/svg+xml">
        <script src="/assets/scripts/site.js" defer></script>
        <script src="/assets/scripts/docs.js" defer></script>

execute:
  enabled: false
